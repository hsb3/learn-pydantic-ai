[project]
name = "learn-pydantic-ai"
version = "0.1.0"
description = "Self-paced curriculum + deep-dive tracks for the Pydantic AI agent framework"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "pydantic-ai>=1.102.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.57.0",
    "temporalio[pydantic]>=1.11.0",
    "uvicorn[standard]>=0.47.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["learn_pydantic_ai"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupytext>=1.19.3",
    "nbconvert>=7.17.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
