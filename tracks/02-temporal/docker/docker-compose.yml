# Self-hosted Temporal stack for the learn-pydantic-ai durable track.
#
# Brings up:
#   - postgresql:13          (persistent store; survives container restarts via the postgres-data volume)
#   - temporalio/auto-setup  (server; auto-creates schema + the learn-pydantic-ai namespace on first boot)
#   - temporalio/ui          (web UI on http://localhost:8080)
#
# Bring up:   make temporal-up
# Tear down:  make temporal-down  (keeps the postgres volume)
# Wipe data:  make temporal-clean (removes the volume — fresh slate)
#
# The auto-setup image handles namespace creation via DEFAULT_NAMESPACE
# below. No init script required.

name: learn-pydantic-ai-temporal

services:
  postgresql:
    image: postgres:13
    container_name: learn-pydantic-ai-postgres
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.27
    container_name: learn-pydantic-ai-temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
      DEFAULT_NAMESPACE: learn-pydantic-ai
      DEFAULT_NAMESPACE_RETENTION: 72h
      SKIP_DEFAULT_NAMESPACE_CREATION: "false"
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    # auto-setup binds to the container's external IP (NOT 127.0.0.1), so
    # the bundled `temporal` CLI's default of localhost:7233 fails. Use
    # `$(hostname)` to target the right address from inside the container.
    healthcheck:
      test: ["CMD-SHELL", "temporal --address $$(hostname):7233 operator cluster health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.36.0
    container_name: learn-pydantic-ai-temporal-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

volumes:
  postgres-data:
    name: learn-pydantic-ai-postgres-data
